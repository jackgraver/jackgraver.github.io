<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Same recipe as the Avatar in simple-track: a diagonal gradient disc, a soft highlight at 30% / 25%
       fading out by 60%, and a 1px inset white ring at 25%. Colours are the heatmap pink. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eeaee0" />
      <stop offset="1" stop-color="#c134a3" />
    </linearGradient>
    <radialGradient id="h" cx="0.3" cy="0.25" r="0.62">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#g)" />
  <circle cx="16" cy="16" r="16" fill="url(#h)" />
  <circle cx="16" cy="16" r="15.5" fill="none" stroke="#fff" stroke-opacity="0.25" />
</svg>
